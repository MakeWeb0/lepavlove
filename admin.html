<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1418B6">
  <title>Panel · Le Pavlove</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/playfair-normal-300-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="flor" viewBox="-60 -60 120 120">
      <g fill="none" stroke="currentColor" stroke-width="3">
        <ellipse cy="-32" rx="12" ry="22"/><ellipse cy="-32" rx="12" ry="22" transform="rotate(45)"/>
        <ellipse cy="-32" rx="12" ry="22" transform="rotate(90)"/><ellipse cy="-32" rx="12" ry="22" transform="rotate(135)"/>
        <ellipse cy="-32" rx="12" ry="22" transform="rotate(180)"/><ellipse cy="-32" rx="12" ry="22" transform="rotate(225)"/>
        <ellipse cy="-32" rx="12" ry="22" transform="rotate(270)"/><ellipse cy="-32" rx="12" ry="22" transform="rotate(315)"/>
        <circle r="7"/>
      </g>
    </symbol>
    <symbol id="fresa" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 92C31 86 16 64 20 44c2-12 14-17 30-14 16-3 28 2 30 14 4 20-11 42-30 48Z"/>
        <path d="M50 30c-6-9-15-11-22-7 7 4 14 7 22 7 8 0 15-3 22-7-7-4-16-2-22 7ZM50 29V13"/>
      </g>
      <g fill="currentColor"><ellipse cx="38" cy="46" rx="2.4" ry="4"/><ellipse cx="52" cy="44" rx="2.4" ry="4"/><ellipse cx="65" cy="48" rx="2.4" ry="4"/><ellipse cx="32" cy="60" rx="2.4" ry="4"/><ellipse cx="46" cy="59" rx="2.4" ry="4"/><ellipse cx="60" cy="61" rx="2.4" ry="4"/><ellipse cx="72" cy="58" rx="2.4" ry="4"/><ellipse cx="40" cy="73" rx="2.4" ry="4"/><ellipse cx="54" cy="75" rx="2.4" ry="4"/><ellipse cx="48" cy="86" rx="2.4" ry="3.6"/></g>
    </symbol>
    <symbol id="arandano" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="52" r="33"/>
        <path d="M41 50a9 9 0 1 1 9 9 5 5 0 0 1-5-5 3 3 0 0 1 3-3"/>
      </g>
    </symbol>
    <symbol id="frambuesa" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
        <circle cx="38" cy="36" r="8"/><circle cx="54" cy="32" r="8"/><circle cx="68" cy="40" r="8"/>
        <circle cx="30" cy="51" r="8"/><circle cx="46" cy="49" r="8"/><circle cx="62" cy="54" r="8"/><circle cx="75" cy="56" r="7"/>
        <circle cx="36" cy="66" r="8"/><circle cx="52" cy="65" r="8"/><circle cx="67" cy="70" r="7.5"/>
        <circle cx="45" cy="80" r="7.5"/><circle cx="59" cy="83" r="7"/>
      </g>
    </symbol>
    <symbol id="hoja" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 84C16 44 44 18 86 14c-2 42-28 70-70 70Z"/>
        <path d="M16 84 70 30M36 64V44M50 50V32M36 64h20M50 50h18"/>
      </g>
    </symbol>
      <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 10 6 6 6-6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></symbol>
      <symbol id="i-up2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 10l5-5 5 5M5 19h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
  </svg>

  <div class="app">
    <aside class="side">
      <a class="side__logo" href="index.html" target="_blank" rel="noopener" aria-label="Abrir la web"><img src="assets/img/logo-ivory.png" alt="Le Pavlove Patisserie" width="520" height="155"></a>
      <p class="side__hello">Panel de <em>la web.</em></p>
      <nav class="nav" id="nav" aria-label="Secciones de la web"></nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" rel="noopener">Abrir la web ↗</a>
        <button type="button" id="btnConn">GitHub: sin conectar</button>
      </div>
    </aside>

    <main class="work">
      <header class="bar">
        <div class="bar__title"><h1 id="secTitle"></h1><p id="secDesc"></p></div>
        <div class="bar__actions">
          <span class="chip" id="status">Todo publicado</span>
          <button type="button" class="btn btn--line btn--sm only-small" id="btnPreview"><svg aria-hidden="true"><use href="#i-eye"/></svg>Vista previa</button>
          <button type="button" class="btn btn--line btn--sm" id="btnDiscard"><svg aria-hidden="true"><use href="#i-undo"/></svg>Deshacer cambios</button>
          <button type="button" class="btn btn--royal" id="btnPublish"><svg aria-hidden="true"><use href="#i-up2"/></svg>Publicar cambios</button>
        </div>
      </header>
      <div class="cols">
        <section class="editor" id="editor" aria-live="polite"></section>
        <aside class="preview" id="preview" aria-label="Vista previa de la web">
          <div class="preview__bar">
            <div class="seg" role="group" aria-label="Tamaño de la vista previa">
              <button type="button" data-dev="desktop" aria-pressed="true">Ordenador</button>
              <button type="button" data-dev="mobile" aria-pressed="false">Móvil</button>
            </div>
            <button type="button" class="btn btn--line btn--sm" id="btnReload"><svg aria-hidden="true"><use href="#i-refresh"/></svg>Recargar</button>
            <button type="button" class="btn btn--royal btn--sm only-small" id="btnClosePreview">Volver a editar</button>
          </div>
          <div class="preview__stage" id="stage">
            <div class="frame" id="frame">
              <iframe id="pv" title="Vista previa de la web" loading="eager"></iframe>
              <div class="frame__load" id="pvLoad"><svg aria-hidden="true"><use href="#flor"/></svg></div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/admin.js"></script>
</body>
</html>
